name: windows-ir-tests

on:
  push:
    paths: ["windows/**", ".github/workflows/windows-ir-tests.yml"]
  pull_request:
    paths: ["windows/**", ".github/workflows/windows-ir-tests.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: windows

jobs:
  analyze:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
      - name: Lint
        shell: pwsh
        run: |
          $r = Invoke-ScriptAnalyzer -Path ./src, ./scripts -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $r | Format-Table -AutoSize
          if (@($r | Where-Object Severity -in 'Error', 'Warning').Count -gt 0) { exit 1 }

  pester-ps51:
    name: Pester (Windows PowerShell 5.1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Pester 5
        shell: powershell
        run: Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
      - name: Unit and integration tests
        shell: powershell
        run: |
          Import-Module Pester -MinimumVersion 5.5.0
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = './tests/Unit', './tests/Integration'
          $cfg.Run.Exit = $true
          $cfg.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $cfg
      - name: Reproducible synthetic demo
        shell: powershell
        run: ./scripts/Invoke-Demo.ps1

  pester-pwsh:
    name: Pester (PowerShell 7, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]   # non-Windows: portable tests only, live tests skip
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Pester 5
        shell: pwsh
        run: Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
      - name: Unit and integration tests
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.5.0
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = './tests/Unit', './tests/Integration'
          $cfg.Run.Exit = $true
          $cfg.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $cfg
      - name: Reproducible synthetic demo
        shell: pwsh
        run: ./scripts/Invoke-Demo.ps1
