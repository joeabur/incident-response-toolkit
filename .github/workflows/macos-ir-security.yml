name: macos-ir-security

on:
  push:
    paths: ["macos/**", ".github/workflows/macos-ir-security.yml"]
  pull_request:
    paths: ["macos/**", ".github/workflows/macos-ir-security.yml"]
  schedule:
    - cron: "23 4 * * 2"

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit
      - name: Audit runtime and pinned dev dependencies
        run: pip-audit -r requirements/constraints.txt
      - name: Static security checks (ruff flake8-bandit rules)
        run: python -m pip install -c requirements/constraints.txt ruff && ruff check --select S --ignore S108,S603 src

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    # Needs the repository's Dependency graph enabled (Settings > Code security). Opt in by setting the
    # repository variable DEPENDENCY_REVIEW_ENABLED=true.
    if: github.event_name == 'pull_request' && vars.DEPENDENCY_REVIEW_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
