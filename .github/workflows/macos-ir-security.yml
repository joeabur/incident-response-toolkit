name: macos-ir-security

on:
  push:
    paths: ["macos/**", ".github/workflows/macos-ir-security.yml"]
  pull_request:
    paths: ["macos/**", ".github/workflows/macos-ir-security.yml"]
  schedule:
    - cron: "23 4 * * 2"

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit
      - name: Audit runtime and pinned dev dependencies
        run: pip-audit -r requirements/constraints.txt
      - name: Static security checks (ruff flake8-bandit rules)
        run: python -m pip install -c requirements/constraints.txt ruff && ruff check --select S --ignore S108,S603 src

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@44c470ffc35caa8b1eb3e8012ca53c2f9bea4eb5 # v2.3.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    # Needs the repository's Dependency graph enabled (Settings > Code security). Opt in by setting the
    # repository variable DEPENDENCY_REVIEW_ENABLED=true.
    if: github.event_name == 'pull_request' && vars.DEPENDENCY_REVIEW_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@3b139cfc5fae8b618d3eae3675e383bb1769c019 # v4.5.0
